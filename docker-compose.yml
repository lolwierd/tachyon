services:
  reader:
    image: ghcr.io/lolwierd/tachyon:latest
    pull_policy: always
    env_file:
      - .env
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      - reader-data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
    restart: unless-stopped

  worker:
    image: ghcr.io/lolwierd/tachyon:latest
    pull_policy: always
    env_file:
      - .env
    environment:
      - RUN_BACKGROUND_WORKER=1
      - FLARESOLVERR_URL=http://flaresolverr:8191
    command: ["./node_modules/.bin/next", "start", "-p", "3001", "-H", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
    volumes:
      - reader-data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: ${CF_TUNNEL_TRANSPORT_PROTOCOL:-auto}
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - reader
    restart: unless-stopped

  traefik:
    image: traefik:v3.5
    environment:
      CF_DNS_API_TOKEN: ${DNS_TOKEN}
    command:
      - --providers.file.filename=/etc/traefik/dynamic/tailscale.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL:-admin@lolwierd.com}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
    ports:
      - "${TAILSCALE_BIND_IP:-100.85.14.86}:80:80"
      - "${TAILSCALE_BIND_IP:-100.85.14.86}:443:443"
    depends_on:
      - reader
    volumes:
      - ./ops/traefik/tailscale.yml:/etc/traefik/dynamic/tailscale.yml:ro
      - traefik-certs:/letsencrypt
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - DOCKER_CONFIG=/config
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.docker/config.json:/config/config.json:ro
    restart: unless-stopped

volumes:
  reader-data:
  traefik-certs:
