services:
  reader:
    build: .
    env_file:
      - .env
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      - reader-data:/app/data
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      - RUN_BACKGROUND_WORKER=1
      - FLARESOLVERR_URL=http://flaresolverr:8191
    command: ["./node_modules/.bin/next", "start", "-p", "3001", "-H", "0.0.0.0"]
    volumes:
      - reader-data:/app/data
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - reader
    restart: unless-stopped

volumes:
  reader-data:
