name: tachyon

services:
  reader:
    image: ghcr.io/lolwierd/tachyon:latest
    pull_policy: always
    env_file:
      - .env
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191
    ports:
      - 127.0.0.1:3010:3000
    volumes:
      - reader-data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  worker:
    image: ghcr.io/lolwierd/tachyon:latest
    pull_policy: always
    env_file:
      - .env
    environment:
      RUN_BACKGROUND_WORKER: "1"
      FLARESOLVERR_URL: http://flaresolverr:8191
    command: ["./node_modules/.bin/next", "start", "-p", "3001", "-H", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
    volumes:
      - reader-data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "30"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      DOCKER_CONFIG: /config
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker/config.json:/config/config.json:ro
    restart: unless-stopped

volumes:
  reader-data:
